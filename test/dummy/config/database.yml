<% db = ENV.fetch("DB", "sqlite") %>

# The database adapter used for running the test suite is selected via the
# DB environment variable ("sqlite", "mysql", or "postgres"), defaulting to
# sqlite. This lets CI (and developers) run the same test suite against
# multiple databases without maintaining separate config files.
default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
<% if db == "mysql" %>
  adapter: mysql2
  encoding: utf8mb4
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1").to_json %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "root").to_json %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "").to_json %>
<% elsif db == "postgres" %>
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1").to_json %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres").to_json %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres").to_json %>
<% else %>
  adapter: sqlite3
  timeout: 5000
<% end %>

development:
  <<: *default
<% if db == "sqlite" %>
  database: storage/development.sqlite3
<% else %>
  database: uchi_dummy_development
<% end %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
<% if db == "sqlite" %>
  database: storage/test.sqlite3
<% else %>
  database: uchi_dummy_test
<% end %>

production:
  <<: *default
<% if db == "sqlite" %>
  # database: path/to/persistent/storage/production.sqlite3
<% else %>
  database: uchi_dummy_production
<% end %>
