version: 0.10.3
files:
  include:
    - "**/*.html"
    - "**/*.rhtml"
    - "**/*.html.erb"
    - "**/*.html+*.erb"
    - "**/*.turbo_stream.erb"
  exclude:
    - app/components/uchi/flowbite/**/*
    - dist/**/*
    - doc/**/*
    - node_modules/**/*
    - test/dummy/**/*
    - vendor/bundle/**/*
    - coverage/**/*

linter:
  enabled: true

formatter:
  enabled: true
  indentWidth: 2
  maxLineLength: 80
